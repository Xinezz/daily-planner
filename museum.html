<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museum</title>
<link rel="icon" href="assets/gallery-btn.png" type="image/png">
<link rel="preload" href="assets/fonts/PatrickHand-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/museum.css">
</head>
<body class="gallery-page">

<nav class="gallery-nav" aria-label="Pages">
  <a href="index.html" class="page-link">&larr; Planner</a>
  <a href="gallery.html" class="page-link">Grand Hall</a>
  <a href="museum.html?wing=updates" class="page-link" id="navUpdates">Update Museum</a>
  <a href="museum.html?wing=projects" class="page-link" id="navProjects">Project Museum</a>
</nav>

<header class="museum-header">
  <p class="sign-small" id="signSmall"></p>
  <h1 id="signTitle"></h1>
  <p class="sign-sub" id="signSub"></p>
  <div class="sign-rule"></div>
</header>

<main class="gallery-hall" id="hall" aria-label="Museum exhibits"></main>

<div class="donate-row">
  <div class="rope" aria-hidden="true"></div>
  <button type="button" class="big-btn" id="addWorkBtn"></button>
  <div class="rope" aria-hidden="true"></div>
</div>

<footer class="floor" aria-hidden="true"></footer>

<dialog id="viewDialog" class="dialog">
  <button type="button" class="dialog-close" data-close="viewDialog" aria-label="Close">&times;</button>
  <div class="view-frame"><div class="view-canvas" id="viewCanvas"></div></div>
  <div class="view-plaque">
    <h2 id="viewTitle"></h2>
    <div class="view-meta" id="viewMeta"></div>
    <p id="viewDesc"></p>
    <div class="dialog-actions">
      <a id="viewLink" class="big-btn" target="_blank" rel="noopener noreferrer">Visit exhibit</a>
      <button type="button" class="big-btn secondary" id="editBtn">Edit</button>
      <button type="button" class="big-btn secondary" id="removeBtn">Remove</button>
    </div>
  </div>
</dialog>

<dialog id="formDialog" class="dialog form-dialog">
  <button type="button" class="dialog-close" data-close="formDialog" aria-label="Close">&times;</button>
  <form id="workForm" method="dialog">
    <h2 id="formHeading"></h2>

    <label><span>Title</span>
      <input type="text" id="fTitle" required maxlength="60">
    </label>
    <div class="form-two">
      <label><span id="lblYear">Year</span>
        <input type="text" id="fYear" maxlength="20">
      </label>
      <label><span id="lblMedium">Medium</span>
        <input type="text" id="fMedium" maxlength="80">
      </label>
    </div>
    <label><span>About it</span>
      <textarea id="fDesc" rows="3" maxlength="400"></textarea>
    </label>
    <label><span>Link</span>
      <input type="text" id="fLink" placeholder="https://... or page.html">
    </label>
    <label><span>Picture</span>
      <input type="file" id="fImage" accept="image/*">
    </label>
    <div class="paste-zone" id="pasteZone" tabindex="0">
      <span id="pasteHint">Or copy a screenshot with Snipping Tool, then press Ctrl+V here</span>
      <img id="pastePreview" alt="Chosen picture preview" hidden>
    </div>
    <div class="form-error" id="formError" hidden></div>

    <div class="dialog-actions">
      <button type="submit" class="big-btn" id="saveBtn">Hang it</button>
      <button type="button" class="big-btn secondary" data-close="formDialog">Cancel</button>
    </div>
  </form>
</dialog>

<script src="js/shared.js"></script>
<script src="js/museum-data.js"></script>
<script src="js/museum.js"></script>
</body>
</html>
