<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Grand Hall</title>
<link rel="icon" href="assets/gallery-btn.png" type="image/png">
<link rel="preload" href="assets/fonts/PatrickHand-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#14110a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/museum.css">
<script src="js/theme.js"></script>
<script src="js/loader.js"></script>
</head>
<body class="gallery-page">

<div class="loader" id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <img class="loader-icon" src="assets/notes-icon.gif" alt="">
  <div class="loader-title">Loading</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-pct">0%</div>
  <div class="loader-tip" id="loaderTip">Tip: choose a door to step inside a museum.</div>
</div>
<noscript><style>.loader { display: none; }</style></noscript>

<nav class="gallery-nav" aria-label="Pages">
  <a href="index.html" class="page-link">&larr; Planner</a>
  <a href="focus.html" class="page-link">Focus Mode</a>
</nav>

<header class="museum-header">
  <p class="sign-small">Welcome to</p>
  <h1>The Grand Hall</h1>
  <p class="sign-sub">Two museums, one entrance. Choose a door.</p>
  <div class="sign-rule"></div>
</header>

<main class="lobby">
  <a class="door" href="museum.html?wing=updates">
    <div class="door-arch door-updates">
      <div class="door-glow"></div>
    </div>
    <div class="plaque">
      <div class="plaque-title">The Update Museum</div>
      <div class="plaque-meta">Every change made to this website</div>
    </div>
  </a>

  <a class="door" href="museum.html?wing=projects">
    <div class="door-arch door-projects">
      <div class="door-glow"></div>
    </div>
    <div class="plaque">
      <div class="plaque-title">The Museum of Projects</div>
      <div class="plaque-meta">Websites built elsewhere</div>
    </div>
  </a>
</main>

<footer class="floor" aria-hidden="true"></footer>

<script src="js/sfx.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync-core.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
